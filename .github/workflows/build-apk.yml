name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IqraX-Companion-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.1.0
        name: "IqraX Companion AI v1.1.0 - Full Human Phone Operator"
        body: |
          ### IqraX Companion AI v1.1.0 - Autonomous Human Phone Operator
          
          **Key Capabilities:**
          - 💬 **WhatsApp Automation**: Send messages to any contact with automatic search, chat selection, and send.
          - 📸 **Instagram Automation**: Automatic DM navigation, user search, compose, and send.
          - 🔐 **Autonomous Email & Password Login**: Automatic detection of email and password fields, credential typing, and form submission.
          - ⚡ **Multi-Command Decomposition**: Compound instruction chains executed step-by-step with real-time Hindi/Hinglish voice feedback.
          - 🖐️ **Accessibility Touch & Typing**: Coordinate gesture tapping, field-specific typing, and clipboard paste fallback.
          
          Download `app-debug.apk` below and install it directly on your Android phone!
        files: app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
